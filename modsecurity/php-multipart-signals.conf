# Observation-only PHP multipart request-shape rules; R1/R3 use upload-progress fields.
# Use with SecRequestBodyAccess On and the MULTIPART body processor.
# Start with SecRuleEngine DetectionOnly and review local false positives.
# IDs are examples: reserve a unique range in your deployment.

# R1: both form-field names must occur in the same parsed multipart request.
SecRule REQUEST_METHOD "@streq POST" \
    "id:20260001,phase:2,pass,log,chain,msg:'PHP upload progress and body session field observed',tag:'php/multipart-observe'"
    SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^multipart/form-data(?:[;, ]|$)" "chain"
        SecRule ARGS_POST_NAMES "@streq PHP_SESSION_UPLOAD_PROGRESS" "chain"
            SecRule ARGS_POST_NAMES "@streq PHPSESSID"

# R8: upload-progress field plus the default session cookie name. This
# observes a cookie-carried session ID that R1's body-field pair misses.
# Legitimate progress forms can match; no cookie value is logged by this rule.
SecRule REQUEST_METHOD "@streq POST" \
    "id:20260008,phase:2,pass,log,chain,msg:'PHP upload progress with session cookie observed',tag:'php/multipart-observe'"
    SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^multipart/form-data(?:[;, ]|$)" "chain"
        SecRule ARGS_POST_NAMES "@streq PHP_SESSION_UPLOAD_PROGRESS" "chain"
            SecRule REQUEST_COOKIES_NAMES "@streq PHPSESSID"

# R2 (40 repeated fields) is deliberately omitted. A single ARGS_POST_NAMES
# match does not establish a count. No counting rule is enabled here.

# R3: size-only heuristic, not proof of repeated uniform parts or an OOM.
SecRule REQUEST_METHOD "@streq POST" \
    "id:20260004,phase:2,pass,log,chain,msg:'Large upload with progress field observed',tag:'php/multipart-observe'"
    SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^multipart/form-data(?:[;, ]|$)" "chain"
        SecRule ARGS_POST_NAMES "@streq PHP_SESSION_UPLOAD_PROGRESS" "chain"
            SecRule REQUEST_BODY_LENGTH "@ge 5242880"

# R4: optional policy for applications that never use upload progress.
# This DENIES the whole matching upload; it is not equivalent to the PHP INI
# setting, which lets the upload proceed without tracking progress.
# Keep disabled until the application owner has confirmed this policy.
# SecRule REQUEST_METHOD "@streq POST" \
#     "id:20260005,phase:2,deny,log,status:403,chain"
#     SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^multipart/form-data(?:[;, ]|$)" "chain"
#         SecRule ARGS_POST_NAMES "@streq PHP_SESSION_UPLOAD_PROGRESS"

# R5 (CVE-2026-109618 OOM strategy: nested field names multiply array work).
# Evidence-only (pass) until validated for false positives in staging.
SecRule ARGS_POST_NAMES "@rx ^[A-Za-z0-9_.-]+(?:\[[^\]\[]{0,64}\]){8,}" \
    "id:20260006,phase:2,pass,log,msg:'Deeply nested multipart field name observed',tag:'php/multipart-observe'"

# R7 (CVE-2026-109618 strategy: multipart request without a usable declared
# Content-Length may keep feeding decoded body data past the pre-read gate).
SecRule REQUEST_METHOD "@streq POST" \
    "id:20260007,phase:2,pass,log,tag:'php/multipart-observe',msg:'Multipart POST without Content-Length observed',chain"
    SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^multipart/form-data(?:[;, ]|$)" "chain"
        SecRule &REQUEST_HEADERS:Content-Length "@eq 0"
