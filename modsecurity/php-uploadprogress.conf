# PHP session.upload_progress UAF pair (CVE-2026-109618 / CVE-2026-109619)
# Defensive detection only; OWASP CRS compatible.
# Requires RequestBodyAccess On and a request-body limit >= 1MB.

# Stage 1 — arming shape: progress key + session id in one multipart POST
SecRule REQUEST_METHOD "@streq POST" \
    "id:20260001,phase:2,deny,log,status:403,tag:'paranoia-level/1',chain"
    SecRule REQUEST_HEADERS:Content-Type "@rx multipart/form-data" "chain"
        SecRule REQUEST_BODY "@rx (?i)name=.PHP_SESSION_UPLOAD_PROGRESS." "chain"
            SecRule REQUEST_BODY "@rx (?i)name=.PHPSESSID."

# Stage 2 — groom shape: repeated t[] parts (static threshold version)
SecRule REQUEST_METHOD "@streq POST" \
    "id:20260002,phase:2,deny,log,status:403,tag:'paranoia-level/1',chain"
    SecRule REQUEST_HEADERS:Content-Type "@rx multipart/form-data" "chain"
        SecRule REQUEST_BODY "@contains name=\"t[]\""

# Stage 2 strict — Lua counting version (recommended): count >= 40 within one body
# Provide via a Lua script binding; the following snippet requires a lua scriptable
# engine (ModSecurity 3):
#   SecRuleScript path/to/count-parts.lua "id:20260003,phase:2,deny,log,status:403"

# Stage 3 — OOM-churn arm (corrected leak model, 2026-10-21): progress arm + very
# large body (surrogate for "many uniform large parts"). Payload-size thresholds
# tune per deployment; the leak arm was ~5.2MB. REQUEST_BODY_LENGTH covers the size
# proxy; needs RequestBodyLimit >= 12MB to see these sizes at all (TUNING.md).
SecRule REQUEST_METHOD "@streq POST" \
    "id:20260004,phase:2,deny,log,status:403,tag:'paranoia-level/1',chain"
    SecRule REQUEST_HEADERS:Content-Type "@rx multipart/form-data" "chain"
        SecRule REQUEST_BODY "@rx (?i)name=.PHP_SESSION_UPLOAD_PROGRESS." "chain"
            SecRule REQUEST_BODY_LENGTH "@ge 5242880"

# Stage 4 — R4 stopgap enforcement: deny ALL progress-name multipart bodies for
# apps that do not legitimately use upload progress bars. This is the edge-side
# equivalent of session.upload_progress.enabled = Off (verified mitigation) and is
# safe only for apps where you confirmed no progress-bar workflow exists. Tune a
# negative match for URLs that (legitimately) host progress UIs:
#   SecRule REQUEST_URI "!@streq /your-progress-endpoint" ...chain on 20260005
SecRule REQUEST_METHOD "@streq POST" \
    "id:20260005,phase:2,drop,log,status:403,tag:'paranoia-level/0',chain"
    SecRule REQUEST_HEADERS:Content-Type "@rx multipart/form-data" "chain"
        SecRule REQUEST_BODY "@rx (?i)name=.PHP_SESSION_UPLOAD_PROGRESS."
